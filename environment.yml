name: SwinFaceMotion
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy=1.26.4
  # PyTorch with CUDA support (optional, remove if CPU only)
  - pytorch::pytorch=2.5.0
  - pytorch::torchvision=0.20.0
  - pytorch::cudatoolkit=11.8
  # Install remaining packages via pip
  - pip:
    - fastapi==0.115.0
    - uvicorn[standard]==0.32.0
    - python-multipart==0.0.12
    - ultralytics==8.3.0
    - facenet-pytorch==2.6.0
    - opencv-python==4.10.0.84
    - pandas==2.2.3
    - matplotlib==3.9.2
    - plotly==5.24.1
    - sqlalchemy==2.0.36
    - psycopg2-binary==2.9.10
    - python-dotenv==1.0.1
    - pillow==10.4.0
    - pydantic==2.10.0
    - pydantic-settings==2.6.0

